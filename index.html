<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site da Vandinha Blogueira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@400;600;800&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--pink:#F7A8C4;--light:#FCE4EC;--strong:#D94F87;--bg:#FFF7FA;--white:#fff;--wine:#642D45;--gold:#C9A25B;--shadow:0 8px 28px rgba(100,45,69,.12)}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{font-family:Nunito,system-ui,sans-serif;color:var(--wine);min-height:100vh;
background:radial-gradient(circle at 12% 8%,rgba(201,162,91,.16) 0 2px,transparent 3px) 0 0/90px 90px,var(--bg);line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{text-align:center;padding:22px 8px 10px}
.brand{font-family:'Great Vibes',cursive;font-size:clamp(2.4rem,11vw,3.8rem);line-height:1.05;margin:0;color:var(--wine);text-shadow:1px 1px 0 var(--gold)}
.rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:8px auto 0;max-width:260px;color:var(--gold)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.card{background:var(--white);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-top:16px;border:1px solid var(--light)}
.notice{background:linear-gradient(135deg,var(--strong),#b93a70);color:#fff;border:2px solid var(--gold);display:flex;gap:12px;align-items:center;font-weight:800;font-size:1.15rem;animation:pop .5s ease}
.notice svg{flex:none;width:32px;height:32px}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.topic{background:var(--light);text-align:center}
.topic small{display:block;font-weight:600;font-size:1rem}
.topic h2{font-family:Lora,serif;margin:4px 0 0;font-size:clamp(1.4rem,6vw,2rem);line-height:1.25;overflow-wrap:anywhere}
.qcard{padding:26px 20px;border:2px solid var(--pink);position:relative}
.pos{display:inline-block;background:var(--strong);color:#fff;border-radius:999px;padding:4px 14px;font-weight:800;font-size:.95rem}
.qtext{font-family:Lora,serif;font-size:clamp(1.5rem,6.5vw,2.3rem);line-height:1.35;margin:16px 0 4px;overflow-wrap:anywhere;white-space:pre-wrap}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
button{font:inherit;font-weight:800;border:0;border-radius:999px;min-height:56px;padding:0 18px;cursor:pointer;background:var(--strong);color:#fff;box-shadow:0 4px 12px rgba(217,79,135,.35);transition:transform .15s,opacity .15s}
button.alt{background:var(--white);color:var(--strong);border:2px solid var(--pink);box-shadow:none}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
.empty{text-align:center;padding:36px 20px}
.empty p{font-family:Lora,serif;font-size:1.3rem;margin:8px 0 0}
.status{text-align:center;font-size:.85rem;margin-top:14px;min-height:1.3em}
.status.err{color:#a3123f;font-weight:800}
.deco{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.sf{position:absolute;display:block;filter:drop-shadow(0 6px 10px rgba(100,45,69,.15))}
.s1{width:clamp(120px,30vw,230px);height:clamp(120px,30vw,230px);top:-40px;right:-45px;opacity:.9;animation:sway 9s ease-in-out infinite}
.s2{width:clamp(90px,22vw,170px);height:clamp(90px,22vw,170px);bottom:-30px;left:-35px;opacity:.85;animation:sway 11s ease-in-out infinite reverse}
.s3{width:clamp(48px,11vw,80px);height:clamp(48px,11vw,80px);top:46%;left:-18px;opacity:.55;animation:sway 8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
.rule svg.mini{width:26px;height:26px;flex:none}
.wrap{position:relative;z-index:1}
@media (min-width:900px){.s3{left:calc(50% - 470px);top:40%;opacity:.7}.s1{right:calc(50% - 560px)}.s2{left:calc(50% - 540px)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="sf" viewBox="-52 -52 104 104">
<g fill="#E9A81C"><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(0)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(24)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(48)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(72)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(96)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(120)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(144)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(168)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(192)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(216)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(240)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(264)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(288)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(312)"/><ellipse cx="0" cy="-33" rx="8.5" ry="18" transform="rotate(336)"/></g>
<g fill="#F7C531"><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(12)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(36)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(60)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(84)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(108)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(132)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(156)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(180)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(204)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(228)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(252)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(276)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(300)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(324)"/><ellipse cx="0" cy="-30" rx="7.5" ry="16" transform="rotate(348)"/></g>
<circle r="20" fill="#5E3A1D"/><circle r="15" fill="#46290F"/>
<g fill="#8A5A2B"><circle cx="0" cy="-9" r="1.6"/><circle cx="8" cy="-4" r="1.6"/><circle cx="8" cy="5" r="1.6"/><circle cx="0" cy="10" r="1.6"/><circle cx="-8" cy="5" r="1.6"/><circle cx="-8" cy="-4" r="1.6"/><circle cx="0" cy="0" r="1.6"/><circle cx="14" cy="0" r="1.6"/><circle cx="-14" cy="0" r="1.6"/><circle cx="0" cy="-15" r="1.6"/><circle cx="0" cy="15" r="1.6"/></g>
</symbol></defs></svg>
<div class="deco" aria-hidden="true">
<svg class="sf s1"><use href="#sf"/></svg>
<svg class="sf s2"><use href="#sf"/></svg>
<svg class="sf s3"><use href="#sf"/></svg>
</div>
<div class="wrap">
  <header>
    <h1 class="brand">Site da Vandinha Blogueira</h1>
    <div class="rule" aria-hidden="true"><svg class="mini"><use href="#sf"/></svg></div>
  </header>

  <section id="notice" class="card notice" role="status" aria-live="polite" hidden>
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="11" y="3" width="10" height="16" rx="5" fill="#fff"/><path d="M7 14a9 9 0 0018 0M16 23v6M11 29h10" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <span id="noticeText"></span>
  </section>

  <main id="loading" class="card empty"><p>Carregando a pauta…</p></main>

  <main id="empty" class="card empty" hidden>
    <p>A Vandinha ainda não publicou a pauta de hoje. Volte em instantes!</p>
  </main>

  <main id="live" hidden>
    <section class="card topic"><small>Pauta de hoje</small><h2 id="topicTitle"></h2></section>
    <section class="card qcard" aria-live="polite">
      <span class="pos" id="pos"></span>
      <p class="qtext" id="qtext"></p>
    </section>
    <div class="nav">
      <button class="alt" id="prev" type="button">Anterior</button>
      <button id="next" type="button">Próxima</button>
    </div>
  </main>

  <p class="status" id="status" role="status"></p>
</div>

<script>
// Endereço da API (altere aqui, se necessário).
const API_BASE = "https://telegramm.pythonanywhere.com";
const POLL_MS = 2000, TIMEOUT_MS = 8000;
const $ = id => document.getElementById(id);
let lastJson = "", inflight = false, navBusy = false, timer = null, state = null, failures = 0;

async function api(path, opts = {}) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
  try {
    const res = await fetch(API_BASE + path, {
      ...opts, signal: ctrl.signal,
      headers: opts.body ? {"Content-Type": "application/json"} : undefined
    });
    let data;
    try { data = await res.json(); } catch { throw new Error("Resposta inválida do servidor."); }
    if (!res.ok) throw new Error(data && data.erro || "Erro no servidor.");
    return data;
  } finally { clearTimeout(t); }
}

function setStatus(msg, err) { const s = $("status"); s.textContent = msg; s.className = "status" + (err ? " err" : ""); }

function valid(d) {
  return d && typeof d === "object" && Array.isArray(d.questions) && d.notice && typeof d.notice.active === "boolean";
}

function render(d) {
  $("loading").hidden = true;
  const n = d.notice, hasNotice = n.active && typeof n.text === "string" && n.text.trim();
  $("notice").hidden = !hasNotice;
  if (hasNotice) $("noticeText").textContent = n.text;
  const qs = d.questions, hasTopic = d.topic && qs.length > 0;
  $("empty").hidden = !!hasTopic;
  $("live").hidden = !hasTopic;
  if (!hasTopic) return;
  $("topicTitle").textContent = d.topic.title;
  const i = Math.max(0, d.current_index);
  $("pos").textContent = "Pergunta " + (i + 1) + " de " + qs.length;
  $("qtext").textContent = qs[i].text;
  $("prev").disabled = navBusy || i <= 0;
  $("next").disabled = navBusy || i >= qs.length - 1;
}

async function poll() {
  if (inflight || document.hidden) return;
  inflight = true;
  try {
    const d = await api("/api/state");
    if (!valid(d)) throw new Error("Resposta inválida do servidor.");
    failures = 0; setStatus("");
    const j = JSON.stringify(d);
    if (j !== lastJson) { lastJson = j; state = d; render(d); }
  } catch (e) {
    failures++;
    if (!state) { $("loading").hidden = false; $("loading").firstElementChild.textContent = "Não foi possível carregar a pauta. Tentando novamente…"; }
    setStatus("Sem conexão com o servidor. Mostrando a última pauta recebida.", true);
  } finally { inflight = false; }
}

async function go(direction) {
  if (navBusy) return;
  navBusy = true; $("prev").disabled = $("next").disabled = true;
  try { await api("/api/current", {method: "PUT", body: JSON.stringify({direction})}); }
  catch (e) { setStatus("Não foi possível trocar de pergunta. Tente novamente.", true); }
  navBusy = false;
  inflight = false; lastJson = ""; await poll();
}

$("prev").addEventListener("click", () => go("prev"));
$("next").addEventListener("click", () => go("next"));
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" && !$("next").disabled) go("next");
  if (e.key === "ArrowLeft" && !$("prev").disabled) go("prev");
});
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
poll(); timer = setInterval(poll, POLL_MS);
</script>
</body>
</html>
